<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiro | 数字世界入口</title>
    <style>
        :root {
            --primary: #7c3aed;
            --accent: #06b6d4;
            --gold: #f59e0b;
            --dark: #0a0a14;
            --darker: #04040c;
            --modal-bg: rgba(10, 10, 20, 0.95);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--darker);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
            cursor: default;
            -webkit-font-smoothing: antialiased;
        }
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .logo-text {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #c4b5fd 0%, #818cf8 20%, #06b6d4 40%, #f59e0b 60%, #f472b6 80%, #c4b5fd 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
            margin-bottom: 10px;
            text-align: center;
            filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.5));
        }
        @keyframes gradient-shift {
            0%,100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        .logo-sub {
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.35);
            color: #b8abff;
            margin-bottom: 24px;
            backdrop-filter: blur(6px);
            animation: fadeInUp 0.7s ease forwards;
        }
        .badge .dot {
            width: 7px;
            height: 7px;
            background: #06b6d4;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 10px #06b6d4;
        }
        @keyframes pulse-dot {
            0%,100% { box-shadow: 0 0 6px #06b6d4; }
            50% { box-shadow: 0 0 22px #06b6d4, 0 0 40px rgba(6,182,212,0.6); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-title {
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
            animation: fadeInUp 0.7s ease 0.08s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
            color: #fff;
        }
        .main-title .highlight {
            background: linear-gradient(135deg, #06b6d4, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-title {
            font-size: clamp(0.9rem, 1.6vw, 1.05rem);
            color: #9ca3af;
            max-width: 520px;
            line-height: 1.7;
            margin-bottom: 32px;
            text-align: center;
            animation: fadeInUp 0.7s ease 0.16s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }
        .payment-card-wrapper {
            animation: fadeInUp 0.7s ease 0.28s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
            position: relative;
            margin-bottom: 24px;
        }
        .payment-card-glow {
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(124,58,237,0.7) 60deg, rgba(6,182,212,0.8) 120deg, rgba(245,158,11,0.7) 180deg, rgba(244,114,182,0.6) 240deg, rgba(124,58,237,0.7) 300deg, transparent 360deg);
            animation: rotate-glow 4s linear infinite;
            filter: blur(22px);
            z-index: -1;
            opacity: 0.65;
        }
        @keyframes rotate-glow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .payment-card {
            position: relative;
            background: rgba(16,16,30,0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 34px 40px;
            text-align: center;
            box-shadow: 0 6px 36px rgba(0,0,0,0.45), 0 0 70px rgba(124,58,237,0.2), 0 0 110px rgba(6,182,212,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
            transition: all 0.4s ease;
            max-width: 440px;
            width: 100%;
        }
        .payment-card:hover {
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 10px 48px rgba(0,0,0,0.55), 0 0 90px rgba(124,58,237,0.35), 0 0 140px rgba(6,182,212,0.2), 0 0 180px rgba(245,158,11,0.15), inset 0 1px 0 rgba(255,255,255,0.07);
            transform: translateY(-2px);
        }
        .payment-card .card-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .payment-card .card-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8888a0;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .payment-card .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .payment-card .card-price {
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
            letter-spacing: 2px;
        }
        .payment-card .card-desc {
            font-size: 0.85rem;
            color: #9999b0;
            margin-bottom: 18px;
        }
        .btn-wrap {
            position: relative;
            display: inline-block;
        }
        .pulse-ring {
            position: absolute;
            inset: -6px;
            border-radius: 70px;
            border: 2px solid rgba(255,255,255,0.2);
            animation: pulse-ring 2.5s ease-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .pulse-ring:nth-child(2) {
            animation-delay: 0.6s;
            inset: -14px;
            border-radius: 80px;
        }
        .pulse-ring:nth-child(3) {
            animation-delay: 1.2s;
            inset: -22px;
            border-radius: 90px;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.75; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .btn-pay, .btn-download {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 35%, #06b6d4 100%);
            background-size: 200% 200%;
            animation: btn-shift 3s ease infinite;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(124,58,237,0.5), 0 0 55px rgba(6,182,212,0.3);
            transition: all 0.4s ease;

            margin: 10px 0;
        }
        .btn-download {
            background: linear-gradient(135deg, #06b6d4 0%, #0e7490 35%, #7c3aed 100%);

        }
        .btn-pay::before, .btn-download::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, #06b6d4, #7c3aed, #f59e0b);
            background-size: 300% 300%;

            z-index: -1;

        .btn-download::before {

        .btn-pay:hover, .btn-download:hover {

        @keyframes btn-shift {

        .btn-pay .btn-arrow, .btn-download .btn-arrow {

        .btn-pay:hover .btn-arrow, .btn-download:hover .btn-arrow { transform: translateX(6px); }
        .security-badges {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.7s ease 0.36s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }
        .sec-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #8888a0;
            letter-spacing: 0.5px;
        }
        .sec-badge .sec-icon { font-size: 0.95rem; color: #06b6d4; }
        .features-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;

            justify-content: center;

            top: 0;
            left: 0;

        .modal-dialog {
            background: rgba(20,20,40,0.9);

            -webkit-backdrop-filter: blur(30px);

        }

            from { transform: scale(0.8); opacity: 0; }

        }
        .modal-dialog .modal-icon {
            font-size: 3rem;

        }
        .modal-dialog h3 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .modal-dialog .password-box {
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(6,182,212,0.6);
            border-radius: 12px;
            padding: 15px;

        }
        .modal-dialog .password-box .label {
            font-size: 0.7rem;

            margin-bottom: 6px;

        .modal-dialog .password-box .password {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            -webkit-background-clip: text;

            background-clip: text;
            letter-spacing: 6px;
            user-select: all;
        }
        .modal-dialog .btn-know {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #06b6d4, #7c3aed);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(6,182,212,0.5);
            transition: all 0.3s ease;
        }
        .modal-dialog .btn-know:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(6,182,212,0.8), 0 0 60px rgba(124,58,237,0.5);
            letter-spacing: 3px;
        }
        .modal-dialog .close-hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .logo-text { font-size: 2.4rem; letter-spacing: 5px; }
            .payment-card { padding: 26px 20px; border-radius: 16px; }
            .payment-card .card-title { font-size: 1.3rem; }
            .payment-card .card-price { font-size: 2rem; }
            .btn-pay, .btn-download { padding: 14px 32px; font-size: 0.95rem; letter-spacing: 1.5px; }
            .payment-card-glow { border-radius: 18px; inset: -3px; filter: blur(14px); }
            .features-row { gap: 10px; }
            .feature-item { font-size: 0.74rem; padding: 7px 12px; }
            .modal-dialog { padding: 30px 20px; }
            .modal-dialog .password { font-size: 2.2rem; }
        }
        @media (max-width: 480px) {
            .logo-text { font-size: 1.8rem; letter-spacing: 4px; }
            .logo-sub { letter-spacing: 4px; font-size: 0.7rem; }
            .payment-card { padding: 20px 14px; border-radius: 14px; }
            .payment-card .card-price { font-size: 1.6rem; }
            .btn-pay, .btn-download { padding: 12px 24px; font-size: 0.85rem; }
            .pulse-ring { display: none; }
        }
    </style>
</head>

    <script>
        // ============ 粒子背景动画 ============
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = -1000, mouseY = -1000;
        const particleCount = 130;
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        document.addEventListener('touchmove', (e) => { if(e.touches.length>0){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; } });
        document.addEventListener('mouseleave', () => { mouseX=-1000; mouseY=-1000; });
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.45;
                this.speedY = (Math.random() - 0.5) * 0.45;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.hue = Math.random()<0.4 ? (Math.random()<0.5?265:185) : (Math.random()<0.5?38:335);
                this.life = Math.random()*300+200;
                this.maxLife = this.life;
                this.twinkleSpeed = Math.random()*0.02+0.005;
                this.twinkleOffset = Math.random()*Math.PI*2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                const dx = mouseX - this.x, dy = mouseY - this.y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                if(dist<170 && mouseX>0 && mouseY>0){
                    const force = (170-dist)/170;
                    this.speedX += (dx/dist)*force*0.025;
                    this.speedY += (dy/dist)*force*0.025;
                }
                this.speedX *= 0.999; this.speedY *= 0.999;
                const maxSpeed=1.4, speed=Math.sqrt(this.speedX**2+this.speedY**2);
                if(speed>maxSpeed){ this.speedX=(this.speedX/speed)*maxSpeed; this.speedY=(this.speedY/speed)*maxSpeed; }
                if(this.x<-20) this.x=canvas.width+20;
                if(this.x>canvas.width+20) this.x=-20;
                if(this.y<-20) this.y=canvas.height+20;
                if(this.y>canvas.height+20) this.y=-20;
                this.life--;
                if(this.life<=0) this.reset();
            }
            getAlpha() {
                const lifeRatio = this.life/this.maxLife;
                const twinkle = Math.sin(this.life*this.twinkleSpeed+this.twinkleOffset)*0.3+0.7;
                return this.opacity*lifeRatio*twinkle;
            }
            draw(ctx) {
                const alpha = this.getAlpha();
                if(alpha<0.04) return;
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                ctx.fillStyle = `hsla(${this.hue},80%,70%,${alpha})`;
                ctx.fill();
                if(this.size>1.2 && alpha>0.35){
                    ctx.beginPath();
                    ctx.arc(this.x,this.y,this.size*2.5,0,Math.PI*2);
                    ctx.fillStyle = `hsla(${this.hue},85%,60%,${alpha*0.13})`;
                    ctx.fill();
                }
            }
        }
        function initParticles() {
            particles = [];
            for(let i=0;i<particleCount;i++) particles.push(new Particle());
        }
        initParticles();
        function drawLines(ctx) {
            for(let i=0;i<particles.length;i++){
                for(let j=i+1;j<particles.length;j++){
                    const dx = particles[i].x-particles[j].x;
                    const dy = particles[i].y-particles[j].y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    const maxDist = 110;
                    if(dist<maxDist){
                        const alpha = (1-dist/maxDist)*0.13;
                        const alphaI = particles[i].getAlpha();
                        const alphaJ = particles[j].getAlpha();
                        const lineAlpha = alpha*Math.min(alphaI,alphaJ)*3;
                        if(lineAlpha>0.008){
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x,particles[i].y);
                            ctx.lineTo(particles[j].x,particles[j].y);
                            ctx.strokeStyle = `rgba(170,170,210,${lineAlpha})`;
                            ctx.lineWidth = 0.4;
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => { p.update(); p.draw(ctx); });
            drawLines(ctx);
            requestAnimationFrame(animate);
        }
        animate();

        // ============ 弹窗逻辑 ============
        const modalOverlay = document.getElementById('modalOverlay');
        const downloadBtn = document.getElementById('downloadBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        downloadBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        confirmBtn.addEventListener('click', () => {
            // 跳转到指定下载链接
            window.location.href = 'https://wwazp.lanzouw.com/b01bjeq54h';
        });

        // 点击遮罩层也可关闭（可选），但这里不关闭，防止误触，仅通过按钮跳转
        // 如果想要点击外部关闭，可以加上：
        // modalOverlay.addEventListener('click', (e) => {
        //   if(e.target === modalOverlay) modalOverlay.classList.remove('active');
        // });
    </script>
