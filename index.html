<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>kiro | 数字世界入口</title>
    <style>
        :root {
            --bg: #04040c;
            --card-bg: rgba(16, 16, 30, 0.82);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 6px 36px rgba(0, 0, 0, 0.45), 0 0 70px rgba(124, 58, 237, 0.2), 0 0 110px rgba(6, 182, 212, 0.12);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.55), 0 0 90px rgba(124,58,237,0.35), 0 0 140px rgba(6,182,212,0.2);
            --primary: #7c3aed;
            --accent: #06b6d4;
            --gold: #f59e0b;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --btn-gradient: linear-gradient(135deg, #7c3aed 0%, #4f46e5 35%, #06b6d4 100%);
            --btn-hover-shadow: 0 12px 40px rgba(124,58,237,0.7), 0 0 80px rgba(6,182,212,0.5);
            --logo-gradient: linear-gradient(135deg, #c4b5fd 0%, #818cf8 20%, #06b6d4 40%, #f59e0b 60%, #f472b6 80%, #c4b5fd 100%);
            --highlight-gradient: linear-gradient(135deg, #06b6d4, #f59e0b);
            --price-gradient: linear-gradient(135deg, #f59e0b, #f97316);
            --modal-bg: rgba(20, 20, 40, 0.9);
            --modal-border: rgba(124, 58, 237, 0.5);
        }

        body.theme-dark {
            --bg: #0a0a0a;
            --card-bg: rgba(25, 25, 15, 0.9);
            --card-border: rgba(212, 175, 55, 0.4);
            --card-shadow: 0 6px 36px rgba(0,0,0,0.6), 0 0 70px rgba(212, 175, 55, 0.3), 0 0 110px rgba(200, 160, 40, 0.2);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.7), 0 0 90px rgba(212,175,55,0.5), 0 0 140px rgba(200,160,40,0.4);
            --primary: #d4af37;
            --accent: #b8860b;
            --gold: #ffd700;
            --text: #e5d5b0;
            --subtext: #b0a583;
            --btn-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 50%, #8b6508 100%);
            --btn-hover-shadow: 0 12px 40px rgba(212,175,55,0.8), 0 0 80px rgba(184,134,11,0.6);
            --logo-gradient: linear-gradient(135deg, #ffd700 0%, #d4af37 30%, #b8860b 60%, #ffd700 100%);
            --highlight-gradient: linear-gradient(135deg, #d4af37, #ff8c00);
            --price-gradient: linear-gradient(135deg, #ffd700, #ff8c00);
            --modal-bg: rgba(30, 30, 15, 0.95);
            --modal-border: rgba(212, 175, 55, 0.7);
        }

        body.theme-aurora {
            --bg: #001a33;
            --card-bg: rgba(10, 25, 45, 0.85);
            --card-border: rgba(0, 255, 200, 0.3);
            --card-shadow: 0 6px 36px rgba(0,0,0,0.5), 0 0 70px rgba(0,255,200,0.25), 0 0 110px rgba(0,180,255,0.2);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.6), 0 0 90px rgba(0,255,200,0.4), 0 0 140px rgba(0,180,255,0.35);
            --primary: #00ffc8;
            --accent: #00b4d8;
            --gold: #90e0ef;
            --text: #d0f0ff;
            --subtext: #90c0d0;
            --btn-gradient: linear-gradient(135deg, #00ffc8 0%, #00b4d8 40%, #0077b6 100%);
            --btn-hover-shadow: 0 12px 40px rgba(0,255,200,0.7), 0 0 80px rgba(0,180,255,0.5);
            --logo-gradient: linear-gradient(135deg, #00ffc8 0%, #00b4d8 30%, #90e0ef 60%, #00ffc8 100%);
            --highlight-gradient: linear-gradient(135deg, #00ffc8, #0077b6);
            --price-gradient: linear-gradient(135deg, #90e0ef, #00b4d8);
            --modal-bg: rgba(10, 30, 50, 0.95);
            --modal-border: rgba(0, 255, 200, 0.6);
        }

        body.theme-cyber {
            --bg: #0d0221;
            --card-bg: rgba(10, 5, 30, 0.9);
            --card-border: rgba(255, 0, 200, 0.4);
            --card-shadow: 0 6px 36px rgba(0,0,0,0.6), 0 0 70px rgba(255,0,200,0.3), 0 0 110px rgba(0,255,255,0.2);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.7), 0 0 90px rgba(255,0,200,0.5), 0 0 140px rgba(0,255,255,0.35);
            --primary: #ff00c8;
            --accent: #00ffff;
            --gold: #ff00ff;
            --text: #f0e0ff;
            --subtext: #c0a0d0;
            --btn-gradient: linear-gradient(135deg, #ff00c8 0%, #7b00ff 40%, #00ffff 100%);
            --btn-hover-shadow: 0 12px 40px rgba(255,0,200,0.8), 0 0 80px rgba(0,255,255,0.6);
            --logo-gradient: linear-gradient(135deg, #ff00c8 0%, #7b00ff 30%, #00ffff 60%, #ff00c8 100%);
            --highlight-gradient: linear-gradient(135deg, #ff00c8, #00ffff);
            --price-gradient: linear-gradient(135deg, #ff00ff, #00ffff);
            --modal-bg: rgba(20, 5, 40, 0.95);
            --modal-border: rgba(255, 0, 200, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s ease, color 0.5s ease;
        }

        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .logo-text {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: var(--logo-gradient);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
            margin-bottom: 10px;
            text-align: center;
            filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.5));
        }

        @keyframes gradient-shift {
            0%,100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        .logo-sub {
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: var(--subtext);
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.35);
            color: #b8abff;
            margin-bottom: 18px;
            backdrop-filter: blur(6px);
            animation: fadeInUp 0.7s ease forwards;
        }

        .badge .dot {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 10px var(--accent);
        }

        @keyframes pulse-dot {
            0%,100% { box-shadow: 0 0 6px var(--accent); }
            50% { box-shadow: 0 0 22px var(--accent), 0 0 40px rgba(6,182,212,0.6); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
            animation: fadeInUp 0.7s ease 0.08s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
            color: #fff;
        }

        .main-title .highlight {
            background: var(--highlight-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-title {
            font-size: clamp(0.9rem, 1.6vw, 1.05rem);
            color: var(--subtext);
            max-width: 520px;
            line-height: 1.7;
            margin-bottom: 24px;
            text-align: center;
            animation: fadeInUp 0.7s ease 0.16s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* ========== 功能卡片网格 (已上移) ========== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto 30px;
            animation: fadeInUp 0.7s ease 0.24s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .feature-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 30px rgba(124,58,237,0.25);
        }

        .feature-card .feat-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .feature-card .feat-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .feature-card .feat-desc {
            font-size: 0.75rem;
            color: #aaa;
            line-height: 1.4;
        }

        /* ========== 支付卡片 ========== */
        .payment-card-wrapper {
            animation: fadeInUp 0.7s ease 0.32s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
            position: relative;
            margin-bottom: 20px;
        }

        .payment-card-glow {
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(124,58,237,0.7) 60deg, rgba(6,182,212,0.8) 120deg, rgba(245,158,11,0.7) 180deg, rgba(244,114,182,0.6) 240deg, rgba(124,58,237,0.7) 300deg, transparent 360deg);
            animation: rotate-glow 4s linear infinite;
            filter: blur(22px);
            z-index: -1;
            opacity: 0.65;
        }

        @keyframes rotate-glow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .payment-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 34px 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: all 0.4s ease;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .payment-card:hover {
            border-color: rgba(255,255,255,0.28);
            box-shadow: var(--card-hover-shadow), inset 0 1px 0 rgba(255,255,255,0.07);
            transform: translateY(-2px);
        }

        .payment-card .card-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .payment-card .card-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8888a0;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .payment-card .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .payment-card .card-price {
            font-size: 2.4rem;
            font-weight: 900;
            background: var(--price-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
            letter-spacing: 2px;
        }

        .payment-card .card-desc {
            font-size: 0.85rem;
            color: #9999b0;
            margin-bottom: 18px;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .btn-card {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            border-radius: 60px;
            background: var(--btn-gradient);
            background-size: 200% 200%;
            animation: btn-shift 3s ease infinite;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(124,58,237,0.4);
            transition: all 0.3s ease;
            min-width: 130px;
        }

        .btn-card:hover {
            transform: scale(1.05);
            box-shadow: var(--btn-hover-shadow);
            letter-spacing: 2px;
        }

        .btn-card:active {
            transform: scale(0.95);
        }

        @keyframes btn-shift {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .security-badges {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.7s ease 0.36s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .sec-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #8888a0;
            letter-spacing: 0.5px;
        }

        .sec-badge .sec-icon {
            font-size: 0.95rem;
            color: var(--accent);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
            text-align: center;
            animation: fadeInUp 0.7s ease 0.42s forwards;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-dialog {
            background: var(--modal-bg);
            backdrop-filter: blur(30px);
            border: 1.5px solid var(--modal-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            animation: modalPop 0.4s ease forwards;
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-dialog .modal-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .modal-dialog h3 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
        }

        .modal-dialog .password-box {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            display: inline-block;
        }

        .modal-dialog .password-box .label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #8888a0;
            margin-bottom: 6px;
        }

        .modal-dialog .password-box .password {
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--price-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            user-select: all;
        }

        .modal-dialog .btn-know {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            background: var(--btn-gradient);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(6,182,212,0.5);
            transition: all 0.3s ease;
        }

        .modal-dialog .btn-know:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(6,182,212,0.8);
        }

        @media (max-width: 768px) {
            .btn-card {
                padding: 12px 16px;
                font-size: 0.82rem;
                min-width: 100px;
            }
            .buttons-row {
                gap: 8px;
            }
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

    <script>
        (function() {
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouseX = -1000, mouseY = -1000;
            const particleCount = 130;
            let currentHues = [265, 185, 38, 335];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            document.addEventListener('touchmove', (e) => { if(e.touches.length>0){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; } });
            document.addEventListener('mouseleave', () => { mouseX=-1000; mouseY=-1000; });

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.speedX = (Math.random() - 0.5) * 0.45;
                    this.speedY = (Math.random() - 0.5) * 0.45;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.hue = currentHues[Math.floor(Math.random() * currentHues.length)] + (Math.random()*20 - 10);
                    this.life = Math.random()*300+200;
                    this.maxLife = this.life;
                    this.twinkleSpeed = Math.random()*0.02+0.005;
                    this.twinkleOffset = Math.random()*Math.PI*2;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    const dx = mouseX - this.x, dy = mouseY - this.y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if(dist<170 && mouseX>0 && mouseY>0){
                        const force = (170-dist)/170;
                        this.speedX += (dx/dist)*force*0.025;
                        this.speedY += (dy/dist)*force*0.025;
                    }
                    this.speedX *= 0.999; this.speedY *= 0.999;
                    const maxSpeed=1.4, speed=Math.sqrt(this.speedX**2+this.speedY**2);
                    if(speed>maxSpeed){ this.speedX=(this.speedX/speed)*maxSpeed; this.speedY=(this.speedY/speed)*maxSpeed; }
                    if(this.x<-20) this.x=canvas.width+20;
                    if(this.x>canvas.width+20) this.x=-20;
                    if(this.y<-20) this.y=canvas.height+20;
                    if(this.y>canvas.height+20) this.y=-20;
                    this.life--;
                    if(this.life<=0) this.reset();
                }
                getAlpha() {
                    const lifeRatio = this.life/this.maxLife;
                    const twinkle = Math.sin(this.life*this.twinkleSpeed+this.twinkleOffset)*0.3+0.7;
                    return this.opacity*lifeRatio*twinkle;
                }
                draw(ctx) {
                    const alpha = this.getAlpha();
                    if(alpha<0.04) return;
                    ctx.beginPath();
                    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                    ctx.fillStyle = `hsla(${this.hue},80%,70%,${alpha})`;
                    ctx.fill();
                    if(this.size>1.2 && alpha>0.35){
                        ctx.beginPath();
                        ctx.arc(this.x,this.y,this.size*2.5,0,Math.PI*2);
                        ctx.fillStyle = `hsla(${this.hue},85%,60%,${alpha*0.13})`;
                        ctx.fill();
                    }
                }
            }

            function initParticles() {
                particles = [];
                for(let i=0;i<particleCount;i++) particles.push(new Particle());
            }
            initParticles();

            function drawLines(ctx) {
                for(let i=0;i<particles.length;i++){
                    for(let j=i+1;j<particles.length;j++){
                        const dx = particles[i].x-particles[j].x;
                        const dy = particles[i].y-particles[j].y;
                        const dist = Math.sqrt(dx*dx+dy*dy);
                        const maxDist = 110;
                        if(dist<maxDist){
                            const alpha = (1-dist/maxDist)*0.13;
                            const alphaI = particles[i].getAlpha();
                            const alphaJ = particles[j].getAlpha();
                            const lineAlpha = alpha*Math.min(alphaI,alphaJ)*3;
                            if(lineAlpha>0.008){
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x,particles[i].y);
                                ctx.lineTo(particles[j].x,particles[j].y);
                                ctx.strokeStyle = `rgba(170,170,210,${lineAlpha})`;
                                ctx.lineWidth = 0.4;
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p => { p.update(); p.draw(ctx); });
                drawLines(ctx);
                requestAnimationFrame(animate);
            }
            animate();

            const themeKeys = ['theme-default', 'theme-dark', 'theme-aurora', 'theme-cyber'];
            const themeHues = {
                'theme-default': [265, 185, 38, 335],
                'theme-dark': [45, 35, 20, 50],
                'theme-aurora': [160, 190, 200, 170],
                'theme-cyber': [300, 180, 280, 330]
            };
            let currentThemeIndex = 0;

            function applyTheme(themeClass) {
                document.body.className = themeClass;
                currentHues = themeHues[themeClass] || [265,185,38,335];
                initParticles();
                localStorage.setItem('kiro-theme', themeClass);
            }

            const savedTheme = localStorage.getItem('kiro-theme');
            if (savedTheme && themeKeys.includes(savedTheme)) {
                currentThemeIndex = themeKeys.indexOf(savedTheme);
                applyTheme(savedTheme);
            } else {
                applyTheme('theme-default');
            }

            document.getElementById('themeSwitchBtn').addEventListener('click', () => {
                currentThemeIndex = (currentThemeIndex + 1) % themeKeys.length;
                applyTheme(themeKeys[currentThemeIndex]);
            });

            document.getElementById('serviceBtn').addEventListener('click', () => {
                window.open('https://qm.qq.com/q/BfEl7b2t8s', '_blank');
            });

            const modalOverlay = document.getElementById('modalOverlay');
            document.getElementById('downloadBtn').addEventListener('click', () => {
                modalOverlay.classList.add('active');
            });
            document.getElementById('confirmBtn').addEventListener('click', () => {
                window.location.href = 'https://wwazp.lanzouw.com/b01bjeq54h';
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('active');
            });
        })();
    </script>
</body>
</html>
