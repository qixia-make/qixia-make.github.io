<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiro | 数字世界入口</title>
    <style>
        :root {
            --bg: #04040c;
            --card-bg: rgba(16, 16, 30, 0.82);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 6px 36px rgba(0, 0, 0, 0.45), 0 0 70px rgba(124, 58, 237, 0.2), 0 0 110px rgba(6, 182, 212, 0.12);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.55), 0 0 90px rgba(124,58,237,0.35), 0 0 140px rgba(6,182,212,0.2);
            --primary: #7c3aed;
            --accent: #06b6d4;
            --gold: #f59e0b;
            --text: #e0e0e0;
            --subtext: #9ca3af;
            --btn-gradient: linear-gradient(135deg, #7c3aed 0%, #4f46e5 35%, #06b6d4 100%);
            --btn-hover-shadow: 0 12px 40px rgba(124,58,237,0.7), 0 0 80px rgba(6,182,212,0.5);
            --logo-gradient: linear-gradient(135deg, #c4b5fd 0%, #818cf8 20%, #06b6d4 40%, #f59e0b 60%, #f472b6 80%, #c4b5fd 100%);
            --highlight-gradient: linear-gradient(135deg, #06b6d4, #f59e0b);
            --price-gradient: linear-gradient(135deg, #f59e0b, #f97316);
            --modal-bg: rgba(20, 20, 40, 0.9);
            --modal-border: rgba(124, 58, 237, 0.5);
            --neon-glow: #ff00cc;
            --trust-bg: rgba(255, 255, 255, 0.05);
            --trust-border: #f5c759;
        }

        /* --- 新增风格 1: Neon (霓虹粉) --- */
        body.theme-neon {
            --bg: #000000;
            --card-bg: rgba(30, 0, 30, 0.85);
            --card-border: rgba(255, 0, 200, 0.5);
            --card-shadow: 0 6px 36px rgba(255,0,200,0.25);
            --card-hover-shadow: 0 10px 48px rgba(0,0,0,0.7), 0 0 90px rgba(255,0,200,0.6);
            --primary: #ff00cc;
            --accent: #cc00ff;
            --gold: #ffcc00;
            --text: #fff5ff;
            --subtext: #ccaacc;
            --btn-gradient: linear-gradient(135deg, #ff00cc 0%, #5500ff 100%);
            --btn-hover-shadow: 0 12px 40px rgba(255,0,204,0.8);
            --logo-gradient: linear-gradient(135deg, #ff00cc, #cc00ff, #ffcc00, #ff00cc);
            --highlight-gradient: linear-gradient(135deg, #ff00cc, #ffcc00);
            --price-gradient: linear-gradient(135deg, #ff00cc, #ffcc00);
            --modal-bg: rgba(20, 0, 20, 0.95);
            --modal-border: #ff00cc;
            --neon-glow: #ff00cc;
            --trust-bg: rgba(255, 0, 200, 0.1);
            --trust-border: #ff00cc;
        }

        /* --- 新增风格 2: Candy (糖果色) --- */
        body.theme-candy {
            --bg: #ffe4f0;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 105, 180, 0.5);
            --card-shadow: 0 6px 36px rgba(255,105,180,0.15);
            --card-hover-shadow: 0 10px 48px rgba(255,105,180,0.3);
            --primary: #ff69b4;
            --accent: #00c0c0;
            --gold: #ffcc00;
            --text: #333333;
            --subtext: #776677;
            --btn-gradient: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            --btn-hover-shadow: 0 12px 40px rgba(255,105,180,0.6);
            --logo-gradient: linear-gradient(135deg, #ff69b4, #ff1493, #ffb6c1, #ff69b4);
            --highlight-gradient: linear-gradient(135deg, #ff1493, #ff69b4);
            --price-gradient: linear-gradient(135deg, #ff1493, #ffb6c1);
            --modal-bg: rgba(255, 240, 245, 0.95);
            --modal-border: #ff69b4;
            --neon-glow: #ff1493;
            --trust-bg: rgba(255, 105, 180, 0.1);
            --trust-border: #ff69b4;
        }

        /* --- 新增风格 3: Sunset (日落橙) --- */
        body.theme-sunset {
            --bg: #1a0a0a;
            --card-bg: rgba(40, 15, 15, 0.9);
            --card-border: #ff8c00;
            --card-shadow: 0 6px 36px rgba(255,140,0,0.3);
            --card-hover-shadow: 0 10px 48px rgba(255,69,0,0.5);
            --primary: #ff4500;
            --accent: #ff8c00;
            --gold: #ffd700;
            --text: #ffeedd;
            --subtext: #cca888;
            --btn-gradient: linear-gradient(135deg, #ff4500 0%, #ff8c00 100%);
            --btn-hover-shadow: 0 12px 40px rgba(255,69,0,0.8);
            --logo-gradient: linear-gradient(135deg, #ff4500, #ff8c00, #ffd700, #ff4500);
            --highlight-gradient: linear-gradient(135deg, #ff4500, #ffd700);
            --price-gradient: linear-gradient(135deg, #ff8c00, #ff4500);
            --modal-bg: rgba(20, 5, 5, 0.95);
            --modal-border: #ff8c00;
            --neon-glow: #ff4500;
            --trust-bg: rgba(255, 69, 0, 0.1);
            --trust-border: #ff8c00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            cursor: default;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* --- 背景粒子画布 --- */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- 额外浮动特效层 --- */
        #sparklesContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            border-radius: 50%;
            animation: floatSparkle linear infinite;
            opacity: 0.5;
            filter: blur(1px);
        }
        @keyframes floatSparkle {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
            min-height: 100vh;
        }

        .logo-text {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: var(--logo-gradient);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 4s ease infinite;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 30px var(--primary));
        }
        @keyframes gradient-shift {
            0%,100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        .logo-sub {
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: var(--subtext);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid var(--card-border);
            color: var(--subtext);
            margin-bottom: 18px;
            backdrop-filter: blur(6px);
        }
        .badge .dot {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 10px var(--accent);
        }
        @keyframes pulse-dot {
            0%,100% { box-shadow: 0 0 6px var(--accent); opacity:0.5; }
            50% { box-shadow: 0 0 22px var(--accent), 0 0 40px var(--accent); opacity:1; }
        }

        .main-title {
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 800;
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .main-title .highlight {
            background: var(--highlight-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,100% { filter: drop-shadow(0 0 5px var(--primary)); }
            50% { filter: drop-shadow(0 0 20px var(--accent)); }
        }

        .sub-title {
            font-size: clamp(0.9rem, 1.6vw, 1.05rem);
            color: var(--subtext);
            text-align: center;
            margin-bottom: 0;
        }

        /* --- 下载按钮 --- */
        .download-area {
            margin: 20px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .download-area .btn-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            border-radius: 60px;
            background: var(--btn-gradient);
            background-size: 200% 200%;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--primary);
            transition: all 0.3s ease;
            min-width: 130px;
            position: relative;
            overflow: hidden;
        }
        .download-area .btn-card:hover {
            transform: scale(1.05);
            box-shadow: var(--btn-hover-shadow);
            letter-spacing: 2px;
        }
        .download-area .btn-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, var(--accent), transparent, var(--gold), transparent);
            animation: rotate-ring 6s linear infinite;
            z-index: -1;
            filter: blur(20px);
        }
        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- 卡片区域通用样式 --- */
        .three-cards-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto 25px;
        }

        .indie-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px 25px;
            width: 220px;
            text-align: center;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: default;
            color: var(--text);
            overflow: hidden;
            animation: card-float 3s ease-in-out infinite;
        }
        .indie-card:nth-child(2) { animation-delay: 0.2s; }
        .indie-card:nth-child(3) { animation-delay: 0.4s; }

        @keyframes card-float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .indie-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: var(--card-hover-shadow);
        }

        /* 动态边框流光 */
        .indie-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: conic-gradient(from 0deg, transparent 0%, var(--primary) 20%, var(--accent) 40%, transparent 60%, var(--gold) 80%, transparent 100%);
            z-index: -1;
            animation: border-rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .indie-card:hover::before {
            opacity: 1;
        }
        @keyframes border-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .indie-card .card-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
            animation: icon-float 2s ease-in-out infinite;
        }
        .indie-card:nth-child(2) .card-icon { animation-delay: 0.15s; }
        .indie-card:nth-child(3) .card-icon { animation-delay: 0.3s; }
        @keyframes icon-float {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.1); }
        }

        .indie-card .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--highlight-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .indie-card .card-desc {
            font-size: 0.85rem;
            color: var(--subtext);
            line-height: 1.6;
        }

        .pay-card-item {
            cursor: pointer;
            text-decoration: none;
        }
        .pay-card-item .card-title {
            background: var(--highlight-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.1rem;
        }

        /* --- 安全支付值得信赖 区块 (点击跳转) --- */
        .trust-wrapper {
            margin: 30px 0 15px 0;
            display: flex;
            justify-content: center;
        }
        .trust-badge {
            position: relative;
            background: var(--trust-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--trust-border);
            border-radius: 60px;
            padding: 12px 32px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            animation: trust-pulse 2s ease-in-out infinite;
            text-decoration: none; /* 去除下划线 */
        }
        .trust-badge .shield-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px var(--gold));
        }
        .trust-badge .lock-icon {
            font-size: 1.2rem;
            margin-right: 4px;
        }
        @keyframes trust-pulse {
            0%,100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
            50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
        }
        .trust-badge::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 60px;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent, var(--accent), transparent);
            z-index: -1;
            animation: border-rotate 3s linear infinite;
            filter: blur(4px);
        }

        /* --- 下方安全徽章 --- */
        .security-area {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sec-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: var(--subtext);
            letter-spacing: 0.5px;
        }
        .sec-badge .sec-icon {
            font-size: 0.95rem;
            color: var(--accent);
        }

        /* --- 弹窗 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-dialog {
            background: var(--modal-bg);
            backdrop-filter: blur(30px);
            border: 1.5px solid var(--modal-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
        }
        .modal-dialog .modal-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .modal-dialog h3 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
        }
        .modal-dialog .password-box {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            display: inline-block;
        }
        .modal-dialog .password-box .password {
            font-size: 2.8rem;
            font-weight: 900;
            background: var(--price-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            user-select: all;
        }
        .modal-dialog .btn-know {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            background: var(--btn-gradient);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent);
            transition: all 0.3s ease;
        }
        .modal-dialog .btn-know:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px var(--accent);
        }

        @media (max-width: 768px) {
            .indie-card {
                width: 90%;
                max-width: 300px;
            }
            .three-cards-row {
                flex-direction: column;
                align-items: center;
            }
            .trust-badge {
                font-size: 0.9rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>

    <script>
        (function() {
            // --- 浮动星星特效 --- 
            const sparklesContainer = document.getElementById('sparklesContainer');
            for (let i = 0; i < 35; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDuration = (Math.random() * 6 + 5) + 's';
                sparkle.style.animationDelay = (Math.random() * 10) + 's';
                sparkle.style.width = (Math.random() * 8 + 4) + 'px';
                sparkle.style.height = sparkle.style.width;
                sparklesContainer.appendChild(sparkle);
            }

            // --- 粒子系统 ---
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let mouseX = -1000, mouseY = -1000;
            const particleCount = 160;
            let currentHues = [265, 185, 38, 335];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            document.addEventListener('touchmove', (e) => { if(e.touches.length>0){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; } });
            document.addEventListener('mouseleave', () => { mouseX=-1000; mouseY=-1000; });

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.6 + 0.4;
                    this.hue = currentHues[Math.floor(Math.random() * currentHues.length)] + (Math.random()*25 - 12);
                    this.life = Math.random()*300 + 200;
                    this.maxLife = this.life;
                    this.twinkleSpeed = Math.random()*0.02 + 0.005;
                    this.twinkleOffset = Math.random()*Math.PI*2;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    const dx = mouseX - this.x, dy = mouseY - this.y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if(dist < 180 && mouseX > 0 && mouseY > 0){
                        const force = (180 - dist) / 180;
                        this.speedX += (dx/dist)*force*0.02;
                        this.speedY += (dy/dist)*force*0.02;
                    }
                    this.speedX *= 0.999; this.speedY *= 0.999;
                    const maxSpeed=1.4, speed=Math.sqrt(this.speedX**2+this.speedY**2);
                    if(speed>maxSpeed){ this.speedX=(this.speedX/speed)*maxSpeed; this.speedY=(this.speedY/speed)*maxSpeed; }
                    if(this.x < -20) this.x = canvas.width + 20;
                    if(this.x > canvas.width + 20) this.x = -20;
                    if(this.y < -20) this.y = canvas.height + 20;
                    if(this.y > canvas.height + 20) this.y = -20;
                    this.life--;
                    if(this.life <= 0) this.reset();
                }
                getAlpha() {
                    const lifeRatio = this.life/this.maxLife;
                    const twinkle = Math.sin(this.life*this.twinkleSpeed+this.twinkleOffset)*0.3 + 0.7;
                    return this.opacity * lifeRatio * twinkle;
                }
                draw(ctx) {
                    const alpha = this.getAlpha();
                    if(alpha < 0.05) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${alpha})`;
                    ctx.fill();
                    if(this.size > 1.5 && alpha > 0.3){
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size*3, 0, Math.PI*2);
                        ctx.fillStyle = `hsla(${this.hue}, 85%, 60%, ${alpha*0.1})`;
                        ctx.fill();
                    }
                }
            }

            function initParticles() {
                particles = [];
                for(let i=0; i<particleCount; i++) particles.push(new Particle());
            }
            initParticles();

            function drawLines(ctx) {
                for(let i=0; i<particles.length; i++){
                    for(let j=i+1; j<particles.length; j++){
                        const dx = particles[i].x-particles[j].x;
                        const dy = particles[i].y-particles[j].y;
                        const dist = Math.sqrt(dx*dx+dy*dy);
                        const maxDist = 110;
                        if(dist < maxDist){
                            const alpha = (1 - dist/maxDist) * 0.15;
                            const alphaI = particles[i].getAlpha();
                            const alphaJ = particles[j].getAlpha();
                            const lineAlpha = alpha * Math.min(alphaI, alphaJ) * 3;
                            if(lineAlpha > 0.008){
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(180, 180, 220, ${lineAlpha})`;
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(ctx); });
                drawLines(ctx);
                requestAnimationFrame(animate);
            }
            animate();

            // --- 主题切换逻辑 (新增 Neon, Candy, Sunset) ---
            const themeKeys = ['theme-default', 'theme-dark', 'theme-aurora', 'theme-cyber', 'theme-neon', 'theme-candy', 'theme-sunset'];
            const themeHues = {
                'theme-default': [265, 185, 38, 335],
                'theme-dark': [45, 35, 20, 50],
                'theme-aurora': [160, 190, 200, 170],
                'theme-cyber': [300, 180, 280, 330],
                'theme-neon': [320, 300, 340, 310],
                'theme-candy': [340, 20, 160, 30],
                'theme-sunset': [15, 25, 35, 40]
            };
            let currentThemeIndex = 0;

            function applyTheme(themeClass) {
                document.body.className = themeClass;
                currentHues = themeHues[themeClass] || [265,185,38,335];
                initParticles();
                localStorage.setItem('kiro-theme', themeClass);
            }

            const savedTheme = localStorage.getItem('kiro-theme');
            if (savedTheme && themeKeys.includes(savedTheme)) {
                currentThemeIndex = themeKeys.indexOf(savedTheme);
                applyTheme(savedTheme);
            } else {
                applyTheme('theme-default');
            }

            document.getElementById('themeSwitchBtn').addEventListener('click', () => {
                currentThemeIndex = (currentThemeIndex + 1) % themeKeys.length;
                applyTheme(themeKeys[currentThemeIndex]);
            });

            document.getElementById('serviceBtn').addEventListener('click', () => {
                window.open('https://qm.qq.com/q/BfEl7b2t8s', '_blank');
            });

            const modalOverlay = document.getElementById('modalOverlay');
            document.getElementById('downloadBtn').addEventListener('click', () => {
                modalOverlay.classList.add('active');
            });
            document.getElementById('confirmBtn').addEventListener('click', () => {
                window.location.href = 'https://wwazp.lanzouw.com/b01bjeq54h';
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('active');
            });
        })();
    </script>
</body>
